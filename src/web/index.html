<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carry</title>
<style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101214;color:#e7e9eb}
body{max-width:900px;margin:auto;padding:1rem}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #30363d}#status{color:#7ee787}.timeline{padding:1rem 0 7rem}.entry{margin:.85rem 0;padding:.8rem;background:#1b1f23;border-radius:7px}.entry.you{background:#18283c}.entry.removed{opacity:.5}.entry.compaction{background:#252a30;color:#c9d1d9;border-left:3px solid #8b949e}.markdown>*:first-child{margin-top:0}.markdown>*:last-child{margin-bottom:0}.markdown p{line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:.5rem;margin:1rem 0;padding:.75rem;background:#1b1f23;border:1px solid #30363d;border-radius:7px}.stat{display:flex;flex-direction:column;gap:.15rem}.stat strong{font-size:1.05rem}.stat label{font-size:.72rem;opacity:.65;text-transform:uppercase;letter-spacing:.04em}.markdown code,.shell-command,.shell-output{font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.markdown code{background:#30363d;border-radius:3px;padding:.1em .25em}.markdown pre,.shell-command,.shell-output{white-space:pre-wrap;overflow:auto;background:#0d1117;border-radius:5px;padding:.7rem}.shell-command{margin:.5rem 0}.shell-output{margin:.5rem 0}.shell-result,.context-pill{display:inline-block;border:1px solid #59636e;border-radius:99px;padding:.12rem .5rem;margin:.2rem .25rem 0 0;font-size:.78rem}.context-pill.protected{border-color:#3fb950;color:#7ee787}.context-pill.removable{border-color:#d29922;color:#e3b341}.context-pill.removed{border-color:#f85149;color:#ff7b72}.composer{position:sticky;bottom:0;background:#101214;padding:1rem 0;border-top:1px solid #30363d}textarea{width:100%;box-sizing:border-box;resize:vertical;background:#1b1f23;color:inherit;border:1px solid #454b52;border-radius:6px;padding:.7rem}button{margin-top:.4rem;padding:.45rem .8rem}h2{font-size:1rem;margin:.2rem 0}.muted{opacity:.65}
</style>
<header><h1>Carry</h1><span id="status">connecting</span></header>
<section id="stats" class="stats" aria-label="Session statistics">
<div class="stat"><strong id="stat-time">—</strong><label>Elapsed</label></div>
<div class="stat"><strong id="stat-steps">0</strong><label>Model calls</label></div>
<div class="stat"><strong id="stat-tokens">0</strong><label>Total tokens</label></div>
<div class="stat"><strong id="stat-input">0</strong><label>Input tokens</label></div>
<div class="stat"><strong id="stat-output">0</strong><label>Output tokens</label></div>
<div class="stat"><strong id="stat-cached">0</strong><label>Cached input</label></div>
<div class="stat"><strong id="stat-shell">0</strong><label>Shell commands</label></div>
<div class="stat"><strong id="stat-compactions">0</strong><label>Compactions</label></div>
<div class="stat"><strong id="stat-retries">0</strong><label>Retries</label></div>
</section>
<main id="activity" class="timeline" aria-live="polite"></main>
<form id="message" class="composer"><textarea id="text" rows="3" placeholder="Describe the task or steer Carry" aria-label="Message"></textarea><button>Send</button><span class="muted">Enter to send · Shift+Enter for a new line</span></form>
<script>
const activity=document.querySelector('#activity'),status=document.querySelector('#status'),text=document.querySelector('#text');
const stat={time:document.querySelector('#stat-time'),steps:document.querySelector('#stat-steps'),tokens:document.querySelector('#stat-tokens'),input:document.querySelector('#stat-input'),output:document.querySelector('#stat-output'),cached:document.querySelector('#stat-cached'),shell:document.querySelector('#stat-shell'),compactions:document.querySelector('#stat-compactions'),retries:document.querySelector('#stat-retries')};
const totals={started:null,last:null,steps:0,total:0,input:0,output:0,cached:0,shell:0,compactions:0,retries:0,finished:false};
function number(value){return Number.isFinite(Number(value))?Number(value):0}
function formatNumber(value){return value.toLocaleString()}
function formatDuration(ms){ms=Math.max(0,ms);const seconds=Math.floor(ms/1000),minutes=Math.floor(seconds/60),hours=Math.floor(minutes/60);return hours?`${hours}h ${minutes%60}m ${seconds%60}s`:minutes?`${minutes}m ${seconds%60}s`:`${seconds}s`}
function renderStats(){const now=(replaying||totals.finished)?(totals.last||Date.now()):Date.now();stat.time.textContent=totals.started===null?'—':formatDuration(now-totals.started);stat.steps.textContent=formatNumber(totals.steps);stat.tokens.textContent=formatNumber(totals.total);stat.input.textContent=formatNumber(totals.input);stat.output.textContent=formatNumber(totals.output);stat.cached.textContent=formatNumber(totals.cached);stat.shell.textContent=formatNumber(totals.shell);stat.compactions.textContent=formatNumber(totals.compactions);stat.retries.textContent=formatNumber(totals.retries)}
setInterval(()=>{if(totals.started!==null&&!replaying&&!totals.finished)renderStats()},1000);
const entries=new Map(),pendingPills=new Map(),shells=new Map();let modelProgress;
let followTail=true,replaying=true,scrollTimer;
function nearBottom(){return window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-80}
function updateFollowTail(){followTail=nearBottom()}
window.addEventListener('scroll',updateFollowTail,{passive:true});
function scrollToTail(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:'auto'})}
function scheduleScrollToTail(){clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(followTail)scrollToTail()},40)}
function entry(kind=''){const follow=followTail;const el=document.createElement('article');el.className='entry '+kind;activity.append(el);if(follow)requestAnimationFrame(scheduleScrollToTail);return el}
function pill(el,label,kind){const p=document.createElement('span');p.className='context-pill '+kind;p.textContent=label;el.append(p)}
function attach(id,label,kind){const el=entries.get(id);if(el){const old=el.querySelector('.context-pill:not(.removed)');if(old){old.className='context-pill '+kind;old.textContent=label}else pill(el,label,kind)}else{pendingPills.set(id,[[label,kind]])}}
function identify(el,id){entries.set(id,el);for(const [label,kind] of pendingPills.get(id)||[])pill(el,label,kind);pendingPills.delete(id)}
function addText(target,value){target.append(document.createTextNode(value))}
function inline(target,value){let cursor=0;for(const match of value.matchAll(/`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*/g)){addText(target,value.slice(cursor,match.index));const el=document.createElement(match[1]?'code':match[2]?'strong':'em');el.textContent=match[1]||match[2]||match[3];target.append(el);cursor=match.index+match[0].length}addText(target,value.slice(cursor))}
function renderMarkdown(value){const out=document.createElement('div');out.className='markdown';let fenced=false,code=[];const flush=()=>{if(code.length){const pre=document.createElement('pre'),c=document.createElement('code');c.textContent=code.join('\n');pre.append(c);out.append(pre);code=[]}};for(const line of value.split('\n')){if(line.startsWith('```')){if(fenced)flush();fenced=!fenced;continue}if(fenced){code.push(line);continue}const heading=line.match(/^(#{1,3})\s+(.*)$/);const list=line.match(/^[-*]\s+(.*)$/);if(heading){const h=document.createElement('h'+heading[1].length);inline(h,heading[2]);out.append(h)}else if(list){let ul=out.lastElementChild;if(!ul||ul.tagName!=='UL'){ul=document.createElement('ul');out.append(ul)}const li=document.createElement('li');inline(li,list[1]);ul.append(li)}else if(line){const p=document.createElement('p');inline(p,line);out.append(p)}}flush();return out}
const scrollObserver=new MutationObserver(()=>{if(followTail&&!replaying)requestAnimationFrame(scheduleScrollToTail)});scrollObserver.observe(activity,{childList:true,subtree:true});
function contextSignals(data){const signals=data.signals||data;for(const id of signals.keep||[])attach(id,'protected','protected');for(const id of signals.drop||[])attach(id,'removable','removable')}
function contextCompacted(data){const c=data.compaction||{};const el=entry('compaction');el.textContent=`Context compacted · ${c.dropped?.length||0} items removed · ~${c.dropped_tokens||0} tokens`;const details=document.createElement('span');details.className='muted';details.textContent=` · trigger: ${data.trigger||'unknown'} · next request saves ~${Math.max(0,Math.round(c.estimated_savings_input_units||0))} input tokens`;el.append(details);for(const id of c.dropped||[]){const old=entries.get(id);if(old){old.classList.add('removed');pill(old,'removed from agent context','removed')}else attach(id,'removed from agent context','removed')}}
function event(value){const type=value.event,data=value.data||{};if(value.timestamp_ms){if(totals.started===null&&type!=='session_ended')totals.started=value.timestamp_ms;totals.last=value.timestamp_ms}if(type==='history_complete'){replaying=false;followTail=true;scheduleScrollToTail();renderStats()}else if(type==='model_progress'){if(!modelProgress){modelProgress=entry('carry');modelProgress.classList.add('muted')}modelProgress.textContent=`Model streaming · ~${data.output_tokens} output tokens · ${data.output_events} events`}else if(type==='model_response'){const usage=data.usage||{};totals.steps++;totals.input+=number(usage.input_tokens);totals.cached+=number(usage.cached_input_tokens);totals.output+=number(usage.output_tokens);totals.total+=number(usage.total_tokens);totals.retries+=number(data.response_retries);renderStats();if(modelProgress){modelProgress.textContent='Model response received';modelProgress=null}}else if(type==='run_started'){const el=entry();el.textContent='Session started: '+data.cwd;identify(el,1)}else if(type==='human_message'){const el=entry('you');el.textContent='You: '+data.message;if(data.context_id)identify(el,data.context_id)}else if(type==='assistant_message'){const el=entry('carry');el.append(renderMarkdown(data.message))}else if(type==='shell_started'){totals.shell++;renderStats();const el=entry('shell');const code=document.createElement('pre');code.className='shell-command';code.textContent='$ '+data.command;el.append(code);shells.set(data.call_id,el)}else if(type==='shell_finished'){const result=data.result||data;const el=shells.get(result.call_id)||entry('shell');if(data.context_id)identify(el,data.context_id);const summary=document.createElement('span');summary.className='shell-result';summary.textContent=`exit ${result.exit_code??'—'} · ${result.duration_ms}ms`;el.append(summary);const output=[result.prompt_output?.head,result.prompt_output?.tail].filter(Boolean).join('\n…\n');if(output){const pre=document.createElement('pre');pre.className='shell-output';pre.textContent=output;el.append(pre)}}else if(type==='context_compacted'){totals.compactions++;renderStats();contextCompacted(data)}else if(type==='context_signals')contextSignals(data);else if(type==='turn_finished'||type==='run_finished'){const el=entry('carry');el.append(renderMarkdown(data.answer||''));if(data.context_id)identify(el,data.context_id)} }
const source=new EventSource('/api/v1/events');source.onopen=()=>status.textContent='connected';source.onerror=()=>status.textContent='reconnecting';source.onmessage=e=>event(JSON.parse(e.data));
async function send(){const message=text.value.trim();if(!message)return;const response=await fetch('/api/v1/messages',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message})});if(response.ok)text.value='';else alert((await response.json()).error)}
document.querySelector('#message').onsubmit=event=>{event.preventDefault();send()};text.addEventListener('keydown',event=>{if(event.key === 'Enter'&&!event.shiftKey){event.preventDefault();send()}});
</script></html>
