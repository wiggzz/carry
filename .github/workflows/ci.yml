---
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infra:
    name: Terraform infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate Terraform without a backend
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test

      - name: Benchmark planning and live-contract tests
        run: python3 -m unittest -v scripts/test_swebench_benchmark.py scripts/test_swebench_live_runner.py

      - name: Release build
        run: cargo build --release --locked

      - name: Scripted fixture
        run: |
          docker build --tag carry:dev .
          ./scripts/run-fixture.sh clamp scripted
