---
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preparation_solver_probe:
        description: 'Probe only: bounded preparation/evaluator diagnostics (no model or cloud worker)'
        type: boolean
        required: false
        default: false
      preparation_probe_stage:
        description: 'solve: Conda; image: Matplotlib; pylint-evaluator: differential; pylint-gold: rebuilt official gold'
        type: choice
        required: false
        default: solve
        options: [solve, image, pylint-evaluator, pylint-gold]

permissions:
  contents: read

jobs:
  preparation-solver-probe:
    name: Preparation / evaluator diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.preparation_solver_probe
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.preparation_probe_stage != 'solve' && 40 || 20 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Test diagnostic failure and evidence paths offline
        run: >-
          python3 -m unittest -v scripts/test_probe_matplotlib_solver.py
          scripts/test_probe_matplotlib_preparation.py scripts/test_swebench_preparation_compat.py
          scripts/test_probe_pylint_evaluator.py scripts/test_probe_pylint_gold.py

      - name: Install pinned official harness for actual-image diagnostic
        if: inputs.preparation_probe_stage != 'solve'
        timeout-minutes: 5
        run: |
          python3 -m venv "$RUNNER_TEMP/swebench-image-probe"
          "$RUNNER_TEMP/swebench-image-probe/bin/python" -m pip install 'swebench==4.1.0'
          "$RUNNER_TEMP/swebench-image-probe/bin/python" -m unittest -v \
            scripts.test_probe_matplotlib_preparation scripts.test_swebench_preparation_compat \
            scripts.test_probe_pylint_evaluator scripts.test_probe_pylint_gold

      - name: Run selected bounded preparation diagnostic
        id: solver
        env:
          PREPARATION_PROBE_STAGE: ${{ inputs.preparation_probe_stage || 'solve' }}
        run: |
          case "$PREPARATION_PROBE_STAGE" in
            solve)
              python3 scripts/probe_matplotlib_solver.py \
                --evidence-dir "$RUNNER_TEMP/matplotlib-solver-evidence" \
                --work-dir "$RUNNER_TEMP/matplotlib-solver-work"
              ;;
            image)
              # Match the production root worker's checkout ownership. Readiness
              # drops all capabilities, so root cannot override runner-owned 0755.
              sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_SHA,GITHUB_RUN_ID \
                "$RUNNER_TEMP/swebench-image-probe/bin/python" scripts/probe_matplotlib_preparation.py \
                --evidence-dir "$RUNNER_TEMP/matplotlib-solver-evidence" \
                --work-dir "$RUNNER_TEMP/matplotlib-image-work"
              ;;
            pylint-evaluator)
              sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_SHA,GITHUB_RUN_ID \
                "$RUNNER_TEMP/swebench-image-probe/bin/python" scripts/probe_pylint_evaluator.py \
                --evidence-dir "$RUNNER_TEMP/matplotlib-solver-evidence" \
                --work-dir "$RUNNER_TEMP/pylint-evaluator-work"
              ;;
            pylint-gold)
              # Private evaluator payloads never enter the uploaded evidence dir.
              sudo --non-interactive --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_SHA,GITHUB_RUN_ID \
                "$RUNNER_TEMP/swebench-image-probe/bin/python" scripts/probe_pylint_gold.py \
                --evidence-dir "$RUNNER_TEMP/matplotlib-solver-evidence" \
                --work-dir "$RUNNER_TEMP/pylint-gold-private"
              ;;
            *) printf 'Unsupported preparation probe stage\n' >&2; exit 2 ;;
          esac

      - name: Record job outcome even if checkout or tests failed
        if: always()
        env:
          SOLVER_STEP_OUTCOME: ${{ steps.solver.outcome }}
          PREPARATION_PROBE_STAGE: ${{ inputs.preparation_probe_stage || 'solve' }}
        run: |
          # The image supervisor owns this evidence directory as root; keep the
          # outcome writer on the same side of that ownership boundary.
          sudo --non-interactive --preserve-env=RUNNER_TEMP,SOLVER_STEP_OUTCOME,PREPARATION_PROBE_STAGE,GITHUB_SHA python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = Path(os.environ["RUNNER_TEMP"]) / "matplotlib-solver-evidence"
          evidence.mkdir(parents=True, exist_ok=True)
          (evidence / "job-outcome.json").write_text(json.dumps({
              "solver_step_outcome": os.environ["SOLVER_STEP_OUTCOME"],
              "preparation_probe_stage": os.environ["PREPARATION_PROBE_STAGE"],
              "github_sha": os.environ["GITHUB_SHA"],
              "result_present": (evidence / "result.json").is_file(),
          }, indent=2) + "\n")
          PY

      # Never upload the solver cache/prefix, let alone dataset or gold content.
      - name: Retain bounded diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: ${{ inputs.preparation_probe_stage == 'pylint-gold' && 'pylint-gold' || inputs.preparation_probe_stage == 'pylint-evaluator' && 'pylint-evaluator' || inputs.preparation_probe_stage == 'image' && 'matplotlib-image' || 'matplotlib-solver' }}-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/matplotlib-solver-evidence/${{ inputs.preparation_probe_stage == 'pylint-gold' && 'result.json' || '' }}
            ${{ runner.temp }}/matplotlib-solver-evidence/job-outcome.json
          if-no-files-found: error
          retention-days: 7

  infra:
    if: github.event_name != 'workflow_dispatch' || !inputs.preparation_solver_probe
    name: Terraform infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Detect infrastructure changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          enabled=true
          if [[ "$EVENT_NAME" != workflow_dispatch \
                && "$BASE_SHA" =~ ^[0-9a-f]{40}$ \
                && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ \
                && "$BASE_SHA" != 0000000000000000000000000000000000000000 \
                && $(git cat-file -t "$BASE_SHA" 2>/dev/null) == commit ]] \
             && git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- infra/ .github/workflows/ci.yml; then
            enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Terraform checks enabled: $enabled"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        if: steps.changes.outputs.enabled == 'true'
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.changes.outputs.enabled == 'true'
        run: terraform -chdir=infra fmt -check -recursive

      - name: Validate Terraform without a backend
        if: steps.changes.outputs.enabled == 'true'
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

  test:
    if: github.event_name != 'workflow_dispatch' || !inputs.preparation_solver_probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate_pr_title.py "$PR_TITLE"

      - name: Install Rust toolchain and portable target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Identify installed Rust version
        id: rust-version
        run: |
          version=$(rustc --version)
          version=${version#rustc }
          version=${version%% *}
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # PR caches are scoped to their merge ref; protected release jobs never
      # restore this cache. Cache only public dependencies and CI build output.
      - name: Restore Rust dependencies and build output
        id: rust-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-musl-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-${{ github.sha }}
          restore-keys: |
            rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-version.outputs.version }}-musl-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'build.rs') }}-

      - name: Format
        run: cargo fmt -- --check

      - name: Build terminal editor binary
        run: cargo build --locked

      - name: Checkpoint size guard behavioral RED and GREEN
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          path = Path('src/proxy.rs')
          original = path.read_bytes()
          source = original.decode()
          start = source.index('    // Never replace a loadable checkpoint with one the loader would reject.\n')
          stop = source.index('    file.sync_all()?;\n', start)
          command = ['cargo', 'test', '--locked', '--bin', 'carry', 'checkpoint_save_limit_', '--', '--nocapture']
          try:
              # Negative control: preserve the exact tests and saver seam, remove
              # only the new size guard. This is not a shipping source artifact.
              path.write_text(source[:start] + '    let _ = max_bytes;\n' + source[stop:])
              red = subprocess.run(command, text=True, capture_output=True, timeout=600)
          finally:
              path.write_bytes(original)
          assert hashlib.sha256(path.read_bytes()).digest() == hashlib.sha256(original).digest()
          print(red.stdout + red.stderr, flush=True)
          expected = ['checkpoint_save_limit_preserves_last_loadable_file',
                      'checkpoint_save_limit_rejects_first_oversized_file_without_temporary']
          assert red.returncode == 101, 'negative control must fail, not pass or fail setup'
          assert all('test proxy::tests::' + name + ' ... FAILED' in red.stdout for name in expected)
          assert 'test proxy::tests::checkpoint_save_limit_accepts_exact_serialized_file_length ... ok' in red.stdout
          assert 'test result: FAILED. 1 passed; 2 failed;' in red.stdout
          assert (red.stdout + red.stderr).count('called `Result::unwrap_err()` on an `Ok` value') == 2
          green = subprocess.run(command, text=True, capture_output=True, timeout=600)
          print(green.stdout + green.stderr, flush=True)
          assert green.returncode == 0 and 'test result: ok. 3 passed; 0 failed;' in green.stdout
          print('CHECKPOINT_SIZE_GUARD_RED_GREEN_PASS: source restored; expected two RED failures and three GREEN passes')
          PY

      - name: Unit tests
        run: cargo test --locked

      - name: Terminal editor PTY tests
        run: python3 tests/terminal_editor.py

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Benchmark planner, runner, worker, and lifecycle tests
        run: >-
          python3 -m unittest -v
          scripts/test_benchmark_progress.py
          scripts/test_benchmark_preparation_telemetry.py
          scripts/test_benchmark_worker_diagnostics.py
          scripts/test_render_swebench_worker_user_data.py
          scripts/test_swebench_benchmark.py
          scripts/test_swebench_live_runner.py
          scripts/test_swebench_smoke.py
          scripts/test_swebench_preparation_compat.py
          scripts/test_probe_matplotlib_solver.py
          scripts/test_probe_matplotlib_preparation.py
          scripts/test_probe_pylint_evaluator.py scripts/test_probe_pylint_gold.py
          scripts/test_build_long_swebench_selection.py
          scripts/test_merge_swebench_attempts.py
          scripts/test_swebench_harness_entrypoint.py
          scripts/test_proxy_benchmark.py
          scripts/test_proxy_workflow.py
          scripts/test_proxy_trial.py
          scripts/test_proxy_native_fixture.py
          scripts/test_proxy_reviewer_cache_fixture.py
          scripts/test_proxy_gateway.py
          scripts/test_proxy_gateway_native_fixture.py
          scripts/test_prepared_swebench_image.py
          scripts/test_swebench_ec2_worker.py
          scripts/test_docker_registry_login.py
          scripts/test_presign_s3.py
          scripts/test_validate_pr_title.py
          scripts/test_wait_for_ec2_termination.py

      - name: Verify preparation against pinned SWE-bench recipes
        run: |
          python3 -m venv "$RUNNER_TEMP/swebench-contract"
          "$RUNNER_TEMP/swebench-contract/bin/python" -m pip install 'swebench==4.1.0'
          "$RUNNER_TEMP/swebench-contract/bin/python" -m unittest -v \
            scripts.test_swebench_preparation_compat scripts.test_swebench_smoke \
            scripts.test_probe_matplotlib_preparation scripts.test_probe_pylint_evaluator scripts.test_probe_pylint_gold

      - name: Build one portable release binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/carry --help >/dev/null

      - name: Upload exact-head portable Carry binary
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: carry-linux-amd64-musl-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/carry
          if-no-files-found: error
          retention-days: 7

      - name: Pinned Node for credential-free native client fixtures
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0

      - name: Actual Codex and Pi HTTP Responses through integrated Carry proxy
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/proxy-clients" --no-audit --no-fund \
            '@openai/codex@0.147.0' '@earendil-works/pi-coding-agent@0.84.2'
          "$RUNNER_TEMP/proxy-clients/node_modules/.bin/codex" --version
          "$RUNNER_TEMP/proxy-clients/node_modules/.bin/pi" --version
          python3 scripts/proxy_native_fixture.py \
            --carry "$PWD/target/x86_64-unknown-linux-musl/release/carry" \
            --codex "$RUNNER_TEMP/proxy-clients/node_modules/.bin/codex" \
            --pi "$RUNNER_TEMP/proxy-clients/node_modules/.bin/pi" \
            --output "$RUNNER_TEMP/proxy-native-fixture"

      - name: Pinned Codex benchmark hosted-tool isolation through actual entrypoint
        run: |
          CARRY_HOSTED_TOOL_FIXTURE_CODEX="$RUNNER_TEMP/proxy-clients/node_modules/.bin/codex" \
          CARRY_HOSTED_TOOL_FIXTURE_OUTPUT="$RUNNER_TEMP/proxy-codex-hosted-tool-fixture" \
            python3 -B -m unittest -v scripts.test_codex_hosted_tools

      - name: Preserve credential-free Codex hosted-tool fixture evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: proxy-codex-hosted-tool-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/proxy-codex-hosted-tool-fixture
          if-no-files-found: error
          retention-days: 7

      - name: Pinned Pi checkpoint policy through production gateway and integrated Carry
        run: |
          python3 scripts/proxy_gateway_native_fixture.py \
            --carry "$PWD/target/x86_64-unknown-linux-musl/release/carry" \
            --pi "$RUNNER_TEMP/proxy-clients/node_modules/.bin/pi" \
            --output "$RUNNER_TEMP/proxy-gateway-native-fixture"

      - name: Reviewer stable cache boundaries through integrated Carry
        run: |
          python3 scripts/proxy_reviewer_cache_fixture.py \
            --carry "$PWD/target/x86_64-unknown-linux-musl/release/carry" \
            --output "$RUNNER_TEMP/proxy-reviewer-cache-fixture"

      - name: Preserve credential-free reviewer cache fixture evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: proxy-reviewer-cache-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/proxy-reviewer-cache-fixture
          if-no-files-found: error
          retention-days: 7

      - name: Preserve credential-free production gateway fixture evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: proxy-gateway-native-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/proxy-gateway-native-fixture
          if-no-files-found: error
          retention-days: 7

      - name: Preserve credential-free native fixture evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: proxy-native-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/proxy-native-fixture
          if-no-files-found: warn
          retention-days: 7

      - name: Build and execute portable Carry harness binary
        run: |
          docker build --tag carry-harness:ci \
            --file containers/swebench-harness/Dockerfile.ci \
            --build-arg BASE_IMAGE='rust@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff' \
            .
          container=$(docker create carry-harness:ci)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/opt/swebench-harness/bin/carry" "$RUNNER_TEMP/carry-portable"
          chmod 0555 "$RUNNER_TEMP/carry-portable"
          docker run --rm --network none \
            --mount "type=bind,src=$RUNNER_TEMP/carry-portable,dst=/carry,readonly" \
            --entrypoint /carry alpine:3.20 --help >/dev/null

      - name: Scripted fixture
        run: |
          docker build --tag carry:dev --file containers/ci/Dockerfile.fixture .
          ./scripts/run-fixture.sh clamp scripted
