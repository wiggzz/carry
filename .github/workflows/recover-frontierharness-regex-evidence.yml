name: Recover retained FrontierHarness Regex evidence

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Task from the frozen tasks-30 manifest whose retained runtime should be recovered
        required: true
        default: terminal-bench/regex-log
        type: string
      runtime_id:
        description: Retained Runta runtime identifier from the infrastructure-invalid trial record
        required: true
        default: fh-9c1ec78442335b8e
        type: string
      checkpoint_name:
        description: Original immutable checkpoint recorded by the infrastructure-invalid trial
        required: true
        default: carry-fh-fbafa2ad28bf
        type: string

permissions:
  contents: read

concurrency:
  group: frontierharness-regex-evidence-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Copy retained Regex evidence (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: frontierharness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Runta CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @runta/runta-cli@0.2.4
          runta --version
          jq --version

      - name: Resume only existing evidence transfer
        env:
          RUNTA_TOKEN: ${{ secrets.RUNTA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FIREWORKS_API_KEY:-}"
          git clone --quiet https://github.com/frontier-harness-eval/eval.git evaluator
          git -C evaluator checkout --quiet e837a70bd6beb4e72eeeda62dd06e3bd34f6cb63
          python3 benchmarks/frontierharness/patch_usage_details.py \
            --target evaluator/skills/frontierharness-eval/scripts/usage_details.py
          python3 benchmarks/frontierharness/patch_calculate_cost.py \
            --target evaluator/skills/frontierharness-eval/scripts/calculate-cost.py
          bash scripts/recover-frontierharness-evidence.sh \
            --source "$GITHUB_WORKSPACE" \
            --evaluator "$GITHUB_WORKSPACE/evaluator" \
            --task '${{ inputs.task_id }}' \
            --runtime '${{ inputs.runtime_id }}' \
            --checkpoint '${{ inputs.checkpoint_name }}' \
            --run-id "evidence-recovery-${{ github.run_id }}-${{ github.run_attempt }}" \
            --out "$GITHUB_WORKSPACE/frontierharness-recovery"

      - name: Upload recovered evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: frontierharness-regex-recovery-${{ github.sha }}-${{ github.run_id }}
          path: frontierharness-recovery
          if-no-files-found: warn
          retention-days: 14
